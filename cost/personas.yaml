# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Thay mọi dòng "(ví dụ)" bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 144
  base: 436
  high: 721
  source: "data pre-class BTC 05–25/11/2026 (evidence/data-mining.md, P0–P2): thấp = 144 người đã hỏi trợ giảng (P2); cơ sở = 436 người có hoạt động (P1); cao = 721 tài khoản (P0). Kế hoạch CP4: TV1 chốt quy mô người dùng"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  # Chia 144 người hỏi trợ giảng theo số phiên hỏi / 21 ngày (một phiên = các lượt cách nhau ≤ 30 phút).
  # Số từ python evidence/count.py → khoá V3_persona; uses_per_month = số phiên TB × 30/21 (ngoại suy).
  # Kế hoạch CP4: TV1 xác định ba persona, TV2 xác định tần suất sử dụng — tên persona giữ theo khung, số là tần suất từ data.
  - name: dung_it
    share: 0.521             # 75/144 người — 1 phiên trong 21 ngày
    uses_per_month: 1.4      # 1 phiên / 21 ngày × 30/21
    turns_per_session: 3     # TB 2.88 lượt / phiên
    source: "data pre-class BTC: V3_persona trong evidence/data-mining-output.json (75/144 người, 1 phiên)"
  - name: dung_vua
    share: 0.333             # 48/144 người — 2–3 phiên
    uses_per_month: 3.4      # TB 2.4 phiên / 21 ngày
    turns_per_session: 4     # TB 3.74 lượt / phiên
    source: "data pre-class BTC: V3_persona trong evidence/data-mining-output.json (48/144 người, 2–3 phiên)"
  - name: dung_nhieu
    share: 0.146             # 21/144 người — ≥4 phiên
    uses_per_month: 8.9      # TB 6.24 phiên / 21 ngày
    turns_per_session: 4     # TB 3.87 lượt / phiên
    source: "data pre-class BTC: V3_persona trong evidence/data-mining-output.json (21/144 người, ≥4 phiên)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:  # USD / 1 triệu token văn bản, Standard
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://aistudio.google.com/docs/pricing#gemini-3.1-flash-lite · xem 28/11/2026"
  - model: gemini-2.5-pro
    input: 1.25
    output: 10.00
    source: "https://aistudio.google.com/docs/pricing#gemini-2.5-pro · Standard, prompt tối đa 200k token · xem 28/11/2026"
