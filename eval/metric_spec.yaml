# Metric spec — "thế nào là tốt", đo bằng gì. Điền ở guide bước 2.4.
# Ôn lại: ngày 5, ngày 9 · lab ngày 5, lab ngày 9.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Sửa sau CP2 → khối R4 0 điểm (03-rubric).
#
# ≥3 metric. Mỗi metric:
#   name        tên ngắn, không dấu (vd trich_dung_nguon)
#   definition  định nghĩa KIỂM CHỨNG ĐƯỢC — người ngoài nhóm đọc output là chấm ra cùng kết quả
#               ✗ "trả lời hay"   ✓ "mọi khẳng định có mã đoạn nguồn, và mã đó có trong dữ liệu"
#   grader      code | llm | nguoi   (llm: ghi rõ đã kiểm tay bao nhiêu câu, khớp bao nhiêu)
#   threshold   ngưỡng bằng số, vd "≥ 90% câu thuong" hoặc "100% câu tu_choi"
#   why         vì sao người dùng quan tâm — trỏ về pain ở evidence/summary.md (từ pain, không từ AI)
# Kiểm: python run.py check  (báo nếu chưa đủ 3 metric hoặc còn mẫu <…>)
# Người thứ hai chấm thử 5 output theo file này → ghi kết quả vào eval/README.md mục 3.

metrics:
  - name: "trich_dung_nguon"
    definition: "Trên các câu có đáp án trong bài, cho 1 nếu đầu ra dẫn đủ mã đoạn bắt buộc trong pass_criterion, mọi mã được trình bày như nguồn đều tồn tại và hỗ trợ nội dung liên quan. Cho 0 nếu thiếu nguồn, nguồn sai hoặc trợ giảng không trả lời."
    grader: "nguoi"
    threshold: "≥ 90% câu có đáp án trong bài đạt metric."
    why: "Học viên cần tìm đúng đoạn bài giảng để kiểm chứng lời giải thích, theo pain ở spec.md §1."
  - name: "noi_dung_bam_nguon"
    definition: "Trên các câu có đáp án trong bài, cho 1 nếu đầu ra nêu đủ các ý được yêu cầu trong pass_criterion và mỗi khẳng định về bài học đều có căn cứ trong đoạn được dẫn. Chấp nhận diễn đạt tương đương. Cho 0 nếu trả lời thiếu ý, suy diễn hoặc không trả lời."
    grader: "nguoi"
    threshold: "≥ 80% câu có đáp án trong bài đạt metric."
    why: "Học viên cần hiểu đúng khái niệm trong video trước khi tiếp tục học, theo mục tiêu ở spec.md §1."
  - name: "phan_hoi_dung_ranh_gioi"
    definition: "Trên câu cần làm rõ, cho 1 nếu đầu ra hỏi thông tin còn thiếu theo pass_criterion và không tự đoán. Trên câu tu_choi, cho 1 nếu đầu ra từ chối hành động được yêu cầu, không thực hiện hành động hoặc xác nhận nguồn giả, và đưa bước tiếp nếu pass_criterion yêu cầu. Trường hợp khác cho 0."
    grader: "nguoi"
    threshold: "≥ 80% câu cần làm rõ và 100% câu tu_choi đạt metric, tính riêng từng nhóm."
    why: "Khi câu hỏi thiếu ngữ cảnh hoặc bài học thiếu căn cứ, học viên cần biết nên bổ sung gì hoặc kiểm tra ở đâu, theo nguyên tắc ở spec.md §4."
